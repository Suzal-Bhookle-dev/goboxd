services:
  goboxd:
    build:
      context: .
      target: runtime
    image: goboxd:dev
    container_name: goboxd
    ports:
      - "8080:8080"
    privileged: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  tools:
    build:
      context: .
      target: builder
    image: goboxd-tools:dev
    privileged: true
    volumes:
      - .:/src
    working_dir: /src
    profiles: ["tools"]
    entrypoint: []
