languages:
  - id: c
    name: C
    source_filename: solution.c
    artifact: solution
    build:
      cmd: /usr/bin/gcc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 1048576, max_processes: 100 }
      flag_allowlist: ["-O0","-O1","-O2","-O3","-Wall","-lm"]
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 3, memory_kb: 524288, max_processes: 64 }

  - id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: solution
    build:
      cmd: /usr/bin/g++
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 1048576, max_processes: 100 }
      flag_allowlist: ["-O0","-O1","-O2","-O3","-Wall","-Wextra","-std=c++17","-std=c++20"]
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 3, memory_kb: 524288, max_processes: 64 }

  - id: java
    name: Java
    source_filename_strategy: from_request
    artifact_filename_strategy: from_request
    build:
      cmd: /usr/bin/javac
      args: ["{{flags}}", "{{source}}"]
      limits: { wall_time_s: 10, memory_kb: 4194304, max_processes: 100 }
    run:
      cmd: /usr/bin/java
      args: ["{{artifact}}"]
      limits: { wall_time_s: 5, memory_kb: 4194304, max_processes: 100 }

  - id: js
    name: JavaScript
    source_filename: solution.js
    run:
      cmd: /usr/bin/node
      args: ["{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 1048576, max_processes: 100 }

  - id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits: { wall_time_s: 9, memory_kb: 102400, max_processes: 100 }

  - id: verilog
    name: Verilog
    source_filename: solution.v
    artifact: solution.vvp
    build:
      cmd: /usr/bin/iverilog
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 512000, max_processes: 50 }
    run:
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits: { wall_time_s: 5, memory_kb: 256000, max_processes: 50 }

  - id: rust
    name: Rust
    source_filename: solution.rs
    artifact: solution
    build:
      cmd: /usr/bin/rustc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits: 
        wall_time_s: 15
        memory_kb: 1048576 
        max_processes: 100
      flag_allowlist: ["-O", "-g", "--edition=2018", "--edition=2021", "opt-level=2", "opt-level=3"]
    run:
      cmd: ./{{artifact}}
      limits: 
        wall_time_s: 3
        memory_kb: 128000
        max_processes: 64

  - id: perl
    name: Perl
    source_filename: solution.pl
    run:
      cmd: /usr/bin/perl
      args: ["{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 128000, max_processes: 50 }

  - id: ada
    name: Ada
    source_filename: solution.adb
    artifact: solution
    build:
      cmd: /usr/bin/gnatmake
      args: ["{{source}}", "-o", "{{artifact}}"]
      limits: { wall_time_s: 15, memory_kb: 524288, max_processes: 100 }
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 3, memory_kb: 128000, max_processes: 64 }

  - id: go
    name: Go
    source_filename: main.go
    artifact: solution
    build:
      cmd: /usr/bin/go
      args: ["build", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 20, memory_kb: 1048576, max_processes: 100 }
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 3, memory_kb: 1048576, max_processes: 64 }
